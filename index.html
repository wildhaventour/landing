yudamos a coordinar el taxi al muelle o al aeropuerto.',a4b:'Te escribimos después del viaje para saber cómo te fue.',a_noche:'The Wooden House Lodge de noche, con la luna llena sobre el balcón, la terraza iluminada y la piscina',neye:'Al caer la noche',nt:'Vuelve a la calma',np:'Después de un día de playas, volcanes y snorkel, The Wooden House Lodge te espera con su terraza iluminada, la piscina y el cielo de Galápagos.',feat:'Nuestra recomendada',lbadge:'Precio especial de lanzamiento',cintro:'Elige tus habitaciones y fechas y descubre el precio de tu estadía. Cupo limitado.',copen:'Consulta tu presupuesto',gate:'Escribe tu nombre y correo para ver el detalle completo de tu presupuesto.',wt:'¿Con quién vienes a Isabela?',wp:'Tortugas, pingüinos, playas y volcanes se disfrutan mejor en compañía. Elige tu plan y te mostramos las habitaciones que mejor le quedan.',w1t:'En pareja',w1p:'Una habitación Superior para dos, con desayuno incluido cada mañana.',w2t:'En familia',w2p:'Habitaciones para tres o varias juntas, para que nadie se quede fuera.',w3t:'Con amigos',w3p:'Combinen habitaciones y armen el viaje entre todos.',w5t:'Viajas solo',w5p:'Una habitación Superior para ti: tu propio espacio para descansar después de cada aventura.',w4t:'Trabajo, escuelas y universidades',w4p:'Compañeros de trabajo, clases y grupos: cotización a la medida.',wgo:'Ver presupuesto →',wgo2:'Cotizar grupo →',gt:'Planifica tu viaje en grupo',gp:'Familias, amigos, escuelas, universidades o empresas: armamos una cotización a la medida de tu grupo, para hasta 23 personas.',g1:'Una sola persona de contacto para todo el grupo.',g2:'Combinamos habitaciones Estándar y Superior según tu grupo.',g3:'Te respondemos con la cotización por WhatsApp o correo.',gcta:'Cotizar viaje en grupo',gmsg:'Hola, quiero cotizar un viaje en grupo a Isabela.\nTipo de grupo (familia, escuela, universidad, empresa):\nNúmero de personas:\nFechas aproximadas:',featn:'Ideal para parejas que buscan un extra de comodidad durante su viaje.',brkh:'Detalle de tu presupuesto',nword:'noches',nw1:'noche',gword:'personas',gw1:'persona',rword:'habitaciones',rw1:'habitación',lroomn:'Habitación',addroom:'+ Agregar otra habitación',rmv:'Quitar',warn:'Superas las habitaciones o personas que tiene el hotel (9 Estándar, 3 Superior, 23 personas). Escríbenos y te cotizamos a mano.',pnight:'/ noche',tot:'Total estimado',ldate:'Fecha de llegada',lnch:'Precio de lanzamiento: cupo limitado (primeras 10 reservas o hasta el 30 de noviembre de 2026), para llegadas hasta el 20 de diciembre de 2026.',wa:'Solicitar esta reserva por WhatsApp',noteF:'Sin IVA para turistas extranjeros con pasaporte sellado y estancia de hasta 90 días.',noteR:'Incluye IVA.',rt:'Habitaciones',st:'Servicios del hotel',ht:'Cómo reservar',hti:'Reservas con un agente que te atiende en persona, antes y después de reservar, en español o inglés.',s1:'Arma tu presupuesto con tus habitaciones y fechas.',s2:'Envía tu solicitud por WhatsApp o correo. Te confirmamos la disponibilidad con el hotel.',s3:'Confirma tu reserva pagando el abono directamente a la cuenta oficial del hotel.',todo3:'Formas de pago: transferencia bancaria internacional o tarjeta a través de WeTravel (con un recargo del 1,6%). Te enviamos los datos de pago una vez confirmada la disponibilidad. Si pagas por transferencia, el monto debe cubrir las comisiones de tu banco.',ft:'Preguntas frecuentes',q1:'¿Pagaré IVA?',a1:'Los turistas extranjeros con pasaporte sellado y estancia de hasta 90 días no pagan IVA en alojamiento. Los ciudadanos y residentes en Ecuador pagan el 15%.',q2:'¿El precio es por habitación?',a2:'Sí. Mostramos el precio de la habitación por noche, según cuántas personas se alojen en ella (1, 2 o 3).',q3:'¿En qué idiomas me atienden?',a3:'En español e inglés.',q4:'¿Tengo una alergia alimentaria o sigo una dieta especial?',a4:'En la isla predomina la comida de mar. Si tienes alergia (mariscos, camarón, pulpo, pescado u otro alimento) o prefieres un menú especial (sin gluten, bajo en azúcar o calorías, alto en proteínas, vegetariano, etc.), escríbenos a bookings@wildhaventour.com antes de viajar. Se lo informamos al hotel y te confirmamos qué puede adaptar. Te recomendamos traer tus propias medicinas desde tu país, suficientes para todo el viaje, porque en la isla pueden no estar disponibles. Por seguridad, no envíes datos de salud por chat.',foot:'Wild Haven Tour, agencia de viajes independiente. Alojamiento: The Wooden House Lodge, Puerto Villamil, Isla Isabela, Galápagos.',fpriv:'Privacidad',fterms:'Condiciones de reserva',llt:'Guía práctica para llegar a Isabela',l1:'Vuelo internacional: llega a Quito (UIO) o a Guayaquil (GYE), la ciudad que prefieras. Desde allí, vuelo a Baltra (isla Santa Cruz), unas 2 horas. Recomendamos volar con LATAM. También se puede entrar por San Cristóbal. Ojo con la hora: Galápagos va una hora atrás del Ecuador continental, así que ajusta tu reloj al aterrizar.',l2:'Antes de volar: Tarjeta de Control de Tránsito (TCT), 20 USD por viajero. Se tramita y se paga en línea, con tarjeta, en el sitio oficial del Gobierno de Galápagos (siig-cgreg.gobiernogalapagos.gob.ec).',l3:'Al llegar a las islas: entrada al Parque Nacional Galápagos, por persona. Turistas internacionales: 200 USD adultos (mayores de 12 años) y 100 USD niños. Comunidad Andina y Mercosur: 100 USD adultos y 50 USD niños. Ecuatorianos y residentes: 30 USD adultos y 15 USD niños.',l4:'De Baltra a Isabela, en ferry o en avioneta. Ferry: unas 2 horas, 30 a 35 USD. Solo hay dos salidas al día desde Santa Cruz, a las 07:00 y a las 15:00 (regresos a las 06:00 y 15:00): si pierdes la lancha, debes esperar a la siguiente, así que planifica tu vuelo con holgura. Compra el pasaje con anticipación, llega al muelle una hora antes y lleva 1 a 2 USD para el taxi acuático. Avioneta: unos 40 minutos, 150 a 180 USD por trayecto.',l5:'Desde San Cristóbal no hay ferry directo: se pasa por Santa Cruz, o se toma avioneta (alrededor de 245 USD).',l6:'Al llegar a Isabela: tasa local de entrada, 10 USD por persona (5 USD ecuatorianos).',l7:'En Puerto Villamil, nuestro equipo te recibe y, si quieres, te acompaña al hotel (10 a 12 minutos). También puedes ir en taxi.',l8:'Estos cobros son por persona y no están incluidos en el hotel; los de las islas se pagan en efectivo. Precios y horarios aproximados: verifícalos antes de viajar.',d1:'Habitación cómoda para 1, 2 o 3 personas, con aire acondicionado, baño privado con agua caliente las 24 horas y WiFi. Según la habitación, las camas son matrimoniales, twin o triples. Desayuno incluido durante toda la estadía.',d2:'Categoría Superior para 1, 2 o 3 personas, con aire acondicionado, baño privado con agua caliente las 24 horas y WiFi. Se adapta como matrimonial, twin o triple. Cada habitación es distinta: algunas tienen cama king y una tiene mezzanine. Desayuno incluido durante toda la estadía.',h5:'Habitación 5',a_h51:'Habitación 5: cama grande con aire acondicionado y ventana',a_h52:'Escalera de madera al mezzanine de la habitación 5',a_h53:'Habitación 5: cama en el mezzanine, bajo el techo de madera',h5n:'Habitación con mezzanine, para hasta 3 personas. Al mezzanine se sube por una escalera de madera empinada.',h6:'Habitación 6',a_h61:'Habitación 6: cama grande y segunda cama, con techo de madera y aire acondicionado',a_h62:'Habitación 6: dos camas, ventana y escritorio',a_h63:'Baño con ducha y toallas',rect:'Recomendaciones para tu viaje',r1:'Medicinas: si tienes una enfermedad o sigues un tratamiento especial, trae tus propias medicinas desde tu país, en cantidad suficiente para todo el viaje y unos días extra por si hay retrasos. Los medicamentos disponibles en la isla pueden ser distintos a los que usas habitualmente.',r2:'Llévalas en tu equipaje de mano, en su envase original y, si puedes, con una copia de la receta.',r3:'Alergias y dieta: en la isla predomina la comida de mar. Si eres alérgico a mariscos, camarones, pulpo, pescado u otro alimento, o prefieres cambios en tu dieta (sin gluten, bajo en calorías o en azúcar, vegetariana, etc.), cuéntanoslo por correo antes de viajar, no por chat. Se lo informamos al hotel y te confirmamos qué puede adaptar antes de tu llegada.',r4:'Equipaje: viaja ligero. Si llevas mucho, un taxi desde el puerto cuesta unos 5 USD y se paga directo al conductor.',r6:'Si te mareas con facilidad, lleva una pastilla para el mareo: el ferry y algunos tours en lancha pueden moverse bastante. Una opción es hacer un tramo en ferry y el otro en avioneta.',r5:'Pasaporte: llévalo a mano. Lo necesitamos para tu reserva y para confirmar que, como turista extranjero, no pagas IVA.',botbtn:'Asistente',req:'Para enviar tu solicitud, escribe tu nombre, tu correo y una fecha de llegada (de hoy en adelante).',bott:'Asistente de reservas',qhint:'Desliza para ver más preguntas →',greet:'¡Hola! Soy el asistente de Wild Haven Tour. Elige una pregunta y con gusto te respondo.',more:'¿Te ayudo con algo más? Si tu duda no está aquí, escríbenos por WhatsApp o correo y te atiende una persona.',msg:'Hola, quiero reservar en The Wooden House.\nNombre: {nm}\nPaís: {co}\nCorreo: {ml}\nHabitaciones:\n{rl}\nNoches: {n}\nLlegada: {a}\nSalida: {d}\nTipo de huésped: {ty}\nPrecio por noche (total): {r}\nTotal estimado: {t}\n\n¿Alguien tiene alergias o necesita una dieta especial? Te lo preguntaremos por correo para avisar al hotel.'},
en:{a_fachada:'The Wooden House Lodge facade and its pool',a_vent:'Room with large windows and garden views',a_escr:'Room with a desk and beds',a_bano:'Bathroom with a sink and a window',a_pisc:'Pool with lounge chairs',a_bar:'Bar next to the pool',a_salon:'Lounge in the social area',a_terr:'Restaurant terrace with set tables',a_plato:'Fish dish prepared by the chef',a_snk:'Snorkel gear rental hut',gnote:'Reference photos: rooms may vary. We confirm the details of each category when we quote.',gcred:'Photos: The Wooden House Lodge.',sv0:'Breakfast included throughout your stay. We also offer bar-restaurant service.',sv1:'Air conditioning',sv2:'Private bathroom and 24-hour hot water',sv3:'WiFi',sv4:'Restaurant and bar, with varied menus and special meals',sv5:'Pool and social areas to relax',sv6:'Drinking water, coffee and tea station',sv7:'Snorkel gear rental: mask with tube, fins and wetsuit',sv8:'Personalized service and a hotel manager available',sv9:'Biosecurity protocols',svnote:'Any other services included in the rate and the cost of extra services (such as snorkel rental) are confirmed when we quote.',pt:'Hotel policies',pi:'General information to help make your stay smooth for everyone. We will keep adding policies.',pol1:'Damages: any damage a guest causes to the hotel\'s facilities, equipment or infrastructure will be charged to the guest, whether accidental or not.',pol2:'Check-in: 12:00 PM. Check-out: 9:00 AM. These are reference times and can be flexible depending on each situation. From check-out time, luggage and belongings are the guest\'s responsibility.',pol5:'Deposit to book: 20% of the total reservation amount (50% if you travel between December 20 and January 10), once availability is confirmed.',pol6:'Refund: if you cancel within 7 days of paying your deposit (up to the same time of day, Ecuador time), 100% of your deposit is refunded.',pol7:'After that deadline, if you cancel, the deposit is not refunded.',pol8:'You can cancel up to 30 days before your arrival (45 days if you travel between December 20 and January 10), the same deadline as the full payment. Please confirm every cancellation by email so the date is on record.',pol9:'The full reservation amount must be paid no later than 30 days before your arrival (45 days if you travel between December 20 and January 10).',pol3:'Personal data: traveler and billing details are requested by email, never through chat, and shared with the hotel only to manage your reservation.',pol4:'Health: if any traveler has an allergy or a medical condition, we recommend bringing their own medication for the whole trip.',qnote:'Estimated quote, subject to hotel availability. The hotel will send the official invoice once the corresponding deposit has been verified.',veye:'October 1835',vt:'Darwin was here, too',vp:'In 1835, a young naturalist named Charles Darwin explored these shores aboard HMS Beagle. What he saw on the islands helped change how we understand life. Today you can reach Isabela, rest at a quiet hotel and begin your own story.',vcap:'Historical recreation made with artificial intelligence.',brand:'Wild Haven Tour',hl1:'Breakfast included',hl3:'Air conditioning and private bathroom',hl4:'Pool',hl5:'We meet you in Puerto Villamil',hse:'Welcome to The Wooden House',hst:'Everything you need to unwind',hsp:'A quiet wooden lodge in Puerto Villamil, close to the sea, made for coming back to after every adventure on the island.',hi1:'Breakfast included every day',hi2:'A short walk to the beach',hi3:'Air conditioning, private bathroom and hot water',hi4:'Pool and social areas to relax',hi5:'Snorkel, fins and wetsuit rental',hi6:'We meet you in Puerto Villamil',hre:'Your rooms',hrp:'Wood-lined rooms, warm and full of natural light. Pick the one that suits your trip.',disc:'Discover the hotel',stript:'Your room is waiting',striph:'Swipe to see more photos →',h1:'Isabela: your adventure and haven in the heart of the Galápagos',sub:'Your stay at The Wooden House Lodge',ct:'Build your quote',lroom:'Room',std:'Standard',sup:'Superior',lpax:'Guests',lnts:'Nights',lres:'You are',foreign:'Foreign tourist',resid:'Resident of Ecuador',lname:'Your name',lcountry:'Country',lemail:'Email',lcons:'We use these details only to handle your request (see Privacy at the bottom of the page). Please do not send a passport, card or payment details here: we will ask for them by email, securely.',em:'Request by email',pp:'Total per night: the rooms you chose, added up',a_supc:'Superior room with a large bed, a window and a desk',at:'We are with you for the whole trip',ap:'From your first message to the day you leave, a real person takes care of you, in English or Spanish.',a1t:'Before you arrive',a1a:'Personal replies on WhatsApp or email, no bots.',a1b:'We send you the guide to getting to Isabela.',a1c:'If you have allergies or a special diet, we let the hotel know before you arrive.',a2t:'Your arrival',a2a:'We meet you at the Puerto Villamil pier and, if you like, walk you to the hotel (10 to 12 minutes). You can also take a taxi (around 5 USD).',a2c:'Check-in from 12:00 PM (a reference time, with flexibility depending on your situation). Whether you arrive earlier or later, we welcome you and help you settle in; if you arrive early, you can wait in the lobby.',a3t:'During your stay',a3a:'Breakfast included every day.',a3b:'Personalized service and a hotel manager available.',a3c:'We are still just a message away on WhatsApp.',a4t:'Your departure',a4a:'We remind you of check-out time (9:00 AM, a reference time with some flexibility) and the ferry schedule, and help you arrange a taxi to the pier or the airport.',a4b:'We check in after your trip to hear how it went.',a_noche:'The Wooden House Lodge at night, with a full moon over the balcony, the lit terrace and the pool',neye:'As night falls',nt:'Come back to calm',np:'After a day of beaches, volcanoes and snorkeling, The Wooden House Lodge welcomes you back with its lit terrace, the pool and the Galápagos sky.',feat:'Our pick',lbadge:'Special launch price',cintro:'Choose your rooms and dates and see the price of your stay. Limited availability.',copen:'Check your quote',gate:'Enter your name and email to see your full quote breakdown.',wt:'Who are you traveling with?',wp:'Tortoises, penguins, beaches and volcanoes are better shared. Pick your plan and we will show you the rooms that fit it best.',w1t:'As a couple',w1p:'A Superior room for two, with breakfast every morning.',w2t:'With family',w2p:'Rooms for three, or several together so no one is left out.',w3t:'With friends',w3p:'Combine rooms and plan the trip together.',w5t:'Traveling solo',w5p:'A Superior room all to yourself: your own space to rest after each adventure.',w4t:'Work, schools and universities',w4p:'Coworkers, classes and groups: a quote tailored to you.',wgo:'See your quote →',wgo2:'Get a group quote →',gt:'Plan your group trip',gp:'Families, friends, schools, universities or companies: we put together a quote tailored to your group, for up to 23 guests.',g1:'One point of contact for the whole group.',g2:'We combine Standard and Superior rooms to fit your group.',g3:'We send you the quote by WhatsApp or email.',gcta:'Get a group quote',gmsg:'Hi, I would like a quote for a group trip to Isabela.\nType of group (family, school, university, company):\nNumber of guests:\nApproximate dates:',featn:'A great choice for couples who want a little extra comfort on their trip.',brkh:'Your quote breakdown',nword:'nights',nw1:'night',gword:'guests',gw1:'guest',rword:'rooms',rw1:'room',lroomn:'Room',addroom:'+ Add another room',rmv:'Remove',warn:'This exceeds the rooms or guests the hotel has (9 Standard, 3 Superior, 23 guests). Message us and we will quote it by hand.',pnight:'/ night',tot:'Estimated total',ldate:'Arrival date',lnch:'Launch price: limited availability (first 10 bookings or until November 30, 2026), for arrivals through December 20, 2026.',wa:'Request this booking on WhatsApp',noteF:'No VAT for foreign tourists with a stamped passport and a stay of up to 90 days.',noteR:'VAT included.',rt:'Rooms',st:'Hotel services',ht:'How to book',hti:'You book with a real agent who helps you personally, before and after you book, in English or Spanish.',s1:'Build your quote with your rooms and dates.',s2:'Send your request by WhatsApp or email. We confirm availability with the hotel.',s3:'Confirm your booking by paying the deposit directly to the hotel\'s official account.',todo3:'Payment options: international bank transfer, or card through WeTravel (with a 1.6% surcharge). We send the payment details once availability is confirmed. If you pay by transfer, the amount must cover your bank\'s fees.',ft:'Frequently asked questions',q1:'Will I pay VAT?',a1:'Foreign tourists with a stamped passport and a stay of up to 90 days do not pay VAT on lodging. Ecuadorian citizens and residents pay 15%.',q2:'Is the price per room?',a2:'Yes. We show the room price per night, depending on how many guests stay in it (1, 2 or 3).',q3:'Which languages do you support?',a3:'Spanish and English.',q4:'I have a food allergy or follow a special diet. What should I do?',a4:'Seafood is the main food on the island. If you have an allergy (shellfish, shrimp, octopus, fish or any other food) or would like a special menu (gluten-free, low-sugar or low-calorie, high-protein, vegetarian, etc.), email us at bookings@wildhaventour.com before your trip. We pass it on to the hotel and confirm what they can adapt. We also recommend bringing your own medication from home, enough for the whole trip, as it may not be available on the island. For your privacy, please do not send health details through chat.',foot:'Wild Haven Tour, independent travel agency. Lodging: The Wooden House Lodge, Puerto Villamil, Isabela Island, Galápagos.',fpriv:'Privacy',fterms:'Booking terms',llt:'Practical guide to getting to Isabela',l1:'International flight: fly into Quito (UIO) or Guayaquil (GYE), whichever you prefer. From there, fly to Baltra (Santa Cruz island), about 2 hours. We recommend flying with LATAM. You can also enter through San Cristóbal. Mind the time: Galápagos is one hour behind mainland Ecuador, so set your watch when you land.',l2:'Before flying: Transit Control Card (TCT), 20 USD per traveler. You apply and pay online, by card, on the official Galápagos Government site (siig-cgreg.gobiernogalapagos.gob.ec).',l3:'On arrival in the islands: Galápagos National Park entrance fee, per person. International tourists: 200 USD adults (over 12) and 100 USD children. Andean Community and Mercosur: 100 USD adults and 50 USD children. Ecuadorians and residents: 30 USD adults and 15 USD children.',l4:'From Baltra to Isabela, by ferry or small plane. Ferry: about 2 hours, 30 to 35 USD. There are only two departures a day from Santa Cruz, at 7:00 AM and 3:00 PM (returns at 6:00 AM and 3:00 PM): if you miss the boat, you must wait for the next one, so plan your flight with room to spare. Buy your ticket in advance, arrive at the pier an hour early and bring 1 to 2 USD for the water taxi. Small plane: about 40 minutes, 150 to 180 USD each way.',l5:'From San Cristóbal there is no direct ferry: you go through Santa Cruz, or take a small plane (around 245 USD).',l6:'On arrival in Isabela: local entry fee, 10 USD per person (5 USD for Ecuadorians).',l7:'In Puerto Villamil, our team meets you and, if you like, walks you to the hotel (10 to 12 minutes). You can also take a taxi.',l8:'These fees are per person and not included in the hotel price; the ones in the islands are paid in cash. Prices and schedules are approximate: please check them before you travel.',d1:'A comfortable room for 1, 2 or 3 guests, with air conditioning, a private bathroom with 24-hour hot water, and WiFi. Depending on the room, beds are double, twin or triple. Breakfast is included throughout your stay.',d2:'Superior category for 1, 2 or 3 guests, with air conditioning, a private bathroom with 24-hour hot water, and WiFi. It can be set up as double, twin or triple. Each room is different: some have a king bed and one has a mezzanine. Breakfast is included throughout your stay.',h5:'Room 5',a_h51:'Room 5: a large bed with air conditioning and a window',a_h52:'Wooden ladder up to the mezzanine in room 5',a_h53:'Room 5: the mezzanine bed under the wood ceiling',h5n:'A room with a mezzanine, for up to 3 guests. The mezzanine is reached by a steep wooden ladder.',h6:'Room 6',a_h61:'Room 6: a large bed and a second bed, with a wood ceiling and air conditioning',a_h62:'Room 6: two beds, a window and a desk',a_h63:'Bathroom with shower and towels',rect:'Travel tips',r1:'Medication: if you have a medical condition or follow a special treatment, bring your own medication from home, enough for the whole trip plus a few extra days in case of delays. The medications available on the island may differ from those you use at home.',r2:'Keep it in your carry-on, in its original packaging and, if possible, with a copy of the prescription.',r3:'Allergies and diet: seafood is the main food on the island. If you are allergic to shellfish, shrimp, octopus, fish or any other food, or you would like changes to your diet (gluten-free, low-calorie or low-sugar, vegetarian, etc.), tell us by email before you travel, not through chat. We pass it on to the hotel and confirm what they can adapt before you arrive.',r4:'Luggage: pack light. With heavy bags, a taxi from the port is around 5 USD, paid directly to the driver.',r6:'If you get seasick easily, bring motion-sickness pills: the ferry and some boat tours can be quite bumpy. One option is to take the ferry one way and the small plane the other.',r5:'Passport: keep it handy. We need it for your reservation and to confirm that, as a foreign tourist, you pay no VAT.',botbtn:'Assistant',req:'To send your request, please enter your name, your email and an arrival date (today or later).',bott:'Booking assistant',qhint:'Swipe for more questions →',greet:'Hi! I\'m the Wild Haven Tour assistant. Pick a question and I\'ll be glad to help.',more:'Anything else I can help with? If your question isn\'t here, message us on WhatsApp or email and a real person will answer.',msg:'Hi, I would like to book at The Wooden House.\nName: {nm}\nCountry: {co}\nEmail: {ml}\nRooms:\n{rl}\nNights: {n}\nArrival: {a}\nCheck-out: {d}\nGuest type: {ty}\nPer night (total): {r}\nEstimated total: {t}\n\nDoes anyone have allergies or need a special diet? We will ask you by email so we can let the hotel know.'}

 brk.forEach(function(r){var d=document.createElement('div');var a=document.createElement('span');a.textContent=r[0];var b=document.createElement('span');b.textContent=r[1];b.style.textAlign='right';d.appendChild(a);d.appendChild(b);bx.appendChild(d)});

 var av=$('arr').value,dep='-',arrTxt='-';if(av){var d0=new Date(av+'T12:00:00'),d1=new Date(d0.getTime()+n*864e5),fo={day:'numeric',month:'long',year:'numeric'},lc=L==='es'?'es-EC':'en-US';arrTxt=d0.toLocaleDateString(lc,fo);dep=d1.toLocaleDateString(lc,fo)}

 $('wa').href='https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(m);
